name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Repository test policy
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate test partition
        run: python tools/test_lanes.py --repo . --check

      - name: Plan event test matrix
        id: matrix
        shell: pwsh
        run: |
          $matrix = python tools/test_lanes.py --repo . --matrix-event "${{ github.event_name }}"
          if ($LASTEXITCODE -ne 0) {
            throw 'Test matrix policy failed'
          }
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check CLI help
        shell: pwsh
        run: |
          $successfulCommands = @(
            ,@('--help')
            ,@('--version')
            ,@('setup', '--help')
            ,@('doctor', '--help')
            ,@('task', 'next', '--help')
            ,@('task', 'complete', '--help')
            ,@('task', 'checkpoint', '--help')
            ,@('handoff', '--help')
            ,@('review', 'prepare', '--help')
            ,@('review', 'target', 'set', '--help')
            ,@('review', 'finding', 'resolve', '--help')
          )
          foreach ($parts in $successfulCommands) {
            python task-governance-tool/scripts/taskgov.py @parts
            if ($LASTEXITCODE -ne 0) {
              throw "Public CLI command failed: $($parts -join ' ')"
            }
          }

          $doctorJson = python task-governance-tool/scripts/taskgov.py doctor --repo . --read-only --json
          if ($LASTEXITCODE -ne 0) {
            throw 'Local package doctor command failed'
          }
          $doctor = $doctorJson | ConvertFrom-Json
          if (-not $doctor.ok -or $doctor.data.components.package.status -ne 'clean') {
            throw "Checked-in package is not clean: $($doctor.data.components.package.status)"
          }

          $removedCommands = @(
            ,@('self', 'status')
            ,@('db', 'status')
            ,@('web', 'export')
          )
          foreach ($parts in $removedCommands) {
            $removedJson = python task-governance-tool/scripts/taskgov.py @parts --read-only --json
            if ($LASTEXITCODE -ne 2) {
              throw "Removed public command did not fail with exit 2: $($parts -join ' ')"
            }
            $removed = $removedJson | ConvertFrom-Json
            if ($removed.ok -or $removed.errors[0].code -ne 'invalid_command') {
              throw "Removed public command did not return invalid_command: $($parts -join ' ')"
            }
          }

          $removedDbJson = python task-governance-tool/scripts/taskgov.py doctor --db ignored --json
          if ($LASTEXITCODE -ne 2) {
            throw 'Removed public --db option did not fail with exit 2'
          }
          $removedDb = $removedDbJson | ConvertFrom-Json
          if ($removedDb.ok -or $removedDb.errors[0].code -ne 'invalid_option') {
            throw 'Removed public --db option did not return invalid_option'
          }
          # Consume the deliberately validated native failure before the Actions epilogue.
          $LASTEXITCODE = 0

      - name: Check release contract
        run: python tools/release_contract.py --repo .

  test:
    name: Windows tests (${{ matrix.lane }}, Python ${{ matrix.python-version }})
    needs: policy
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test lane
        run: python tools/test_lanes.py --repo . --lane "${{ matrix.lane }}" --ci-event "${{ github.event_name }}" --expected-python "${{ matrix.python-version }}"

  release-candidate:
    name: Full release-candidate gate
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs:
      - policy
      - test
    runs-on: windows-latest

    steps:
      - name: Require policy and complete test matrix
        shell: pwsh
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if (
            $env:POLICY_RESULT -ne 'success' -or
            $env:TEST_RESULT -ne 'success'
          ) {
            throw 'Full release-candidate gate failed'
          }
