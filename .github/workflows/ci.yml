name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows skill checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check CLI help
        run: |
          python task-governance-tool/scripts/taskgov.py --help
          python task-governance-tool/scripts/taskgov.py --version
          python task-governance-tool/scripts/taskgov.py task next --help
          python task-governance-tool/scripts/taskgov.py handoff --help
          python task-governance-tool/scripts/taskgov.py review target set --help
          python task-governance-tool/scripts/taskgov.py web export --help

      - name: Skill package self-check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $skillRoot = 'task-governance-tool'
          $skillMd = Get-Content -Raw "$skillRoot/SKILL.md"
          $frontmatter = [regex]::Match($skillMd, '(?s)\A---\r?\n(.*?)\r?\n---')
          if (-not $frontmatter.Success) {
            throw 'SKILL.md is missing YAML frontmatter'
          }

          $keys = @()
          $name = $null
          $description = $null
          foreach ($line in ($frontmatter.Groups[1].Value -split "\r?\n")) {
            if ($line -match '^([^:]+):\s*(.*)$') {
              $keys += $Matches[1]
              if ($Matches[1] -eq 'name') {
                $name = $Matches[2]
              }
              if ($Matches[1] -eq 'description') {
                $description = $Matches[2]
              }
            }
          }

          if (($keys -join ',') -ne 'name,description') {
            throw "Unexpected frontmatter keys: $($keys -join ',')"
          }
          if ($name -ne 'task-governance-tool') {
            throw "Skill name mismatch: $name"
          }
          if (-not $description -or $description -notmatch 'task') {
            throw 'Skill description is missing task trigger context'
          }

          $requiredFiles = @(
            "$skillRoot/SKILL.md",
            "$skillRoot/agents/openai.yaml",
            "$skillRoot/scripts/taskgov.py",
            "$skillRoot/scripts/task_governance_tool/__init__.py",
            "$skillRoot/scripts/task_governance_tool/cli.py",
            "$skillRoot/scripts/task_governance_tool/storage.py",
            "$skillRoot/scripts/task_governance_tool/tasks.py",
            "$skillRoot/scripts/task_governance_tool/ordering.py",
            "$skillRoot/scripts/task_governance_tool/selection.py",
            "$skillRoot/scripts/task_governance_tool/completion.py",
            "$skillRoot/scripts/task_governance_tool/reviews.py",
            "$skillRoot/scripts/task_governance_tool/git_snapshot.py",
            "$skillRoot/scripts/task_governance_tool/handoffs.py",
            "$skillRoot/scripts/task_governance_tool/viewer.py",
            "$skillRoot/assets/task-viewer.template.html",
            "$skillRoot/references/task_workflow.md",
            "$skillRoot/references/cli_contracts.md"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Missing required skill package file: $file"
            }
          }

          $runtimeInit = Get-Content -Raw "$skillRoot/scripts/task_governance_tool/__init__.py"
          $storage = Get-Content -Raw "$skillRoot/scripts/task_governance_tool/storage.py"
          $viewer = Get-Content -Raw "$skillRoot/scripts/task_governance_tool/viewer.py"
          $workflow = Get-Content -Raw "$skillRoot/references/task_workflow.md"
          $contracts = Get-Content -Raw "$skillRoot/references/cli_contracts.md"
          $readme = Get-Content -Raw 'README.md'
          $release = Get-Content -Raw 'docs/release-install.md'
          if ($runtimeInit -notmatch '__version__\s*=\s*"0\.4\.0"') {
            throw 'Runtime package version is not 0.4.0'
          }
          if ($storage -notmatch 'SCHEMA_VERSION\s*=\s*7') {
            throw 'Runtime schema version is not 7'
          }
          if ($viewer -notmatch 'SNAPSHOT_VERSION\s*=\s*3') {
            throw 'Viewer snapshot version is not 3'
          }
          foreach ($document in @($skillMd, $workflow, $contracts, $readme, $release)) {
            if ($document -notmatch 'git_snapshot') {
              throw 'Public guidance is missing git_snapshot'
            }
            if ($document -notmatch 'reopen') {
              throw 'Public guidance is missing done/reopen behavior'
            }
            if ($document -notmatch 'handoff record') {
              throw 'Public guidance is missing local handoff behavior'
            }
          }
          if ($release -notmatch 'schema v7' -or $release -notmatch '0\.4\.0') {
            throw 'Release guidance is inconsistent with version 0.4.0/schema v7'
          }

      - name: Guard generated artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object {
            $_ -match '(^references/)' -or
            $_ -match '(^task-governance-tool/state/)' -or
            $_ -match '(^\.agents/skills/[^/]+/state/)' -or
            $_ -match '(^|/)task-viewer\.html$' -or
            $_ -match '(\.sqlite3?$|\.sqlite3?-(shm|wal|journal)$)' -or
            $_ -match '(\.db$|\.db-(shm|wal|journal)$)' -or
            $_ -match '(__pycache__/|\.pyc$|\.log$|\.tmp$)'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked artifact: $_" }
            throw 'Forbidden generated artifacts are tracked'
          }
