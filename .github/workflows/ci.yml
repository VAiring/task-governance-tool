name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows skill checks (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check CLI help
        shell: pwsh
        run: |
          $successfulCommands = @(
            ,@('--help')
            ,@('--version')
            ,@('setup', '--help')
            ,@('doctor', '--help')
            ,@('task', 'next', '--help')
            ,@('task', 'complete', '--help')
            ,@('task', 'checkpoint', '--help')
            ,@('handoff', '--help')
            ,@('review', 'prepare', '--help')
            ,@('review', 'target', 'set', '--help')
            ,@('review', 'finding', 'resolve', '--help')
          )
          foreach ($parts in $successfulCommands) {
            python task-governance-tool/scripts/taskgov.py @parts
            if ($LASTEXITCODE -ne 0) {
              throw "Public CLI command failed: $($parts -join ' ')"
            }
          }

          $doctorJson = python task-governance-tool/scripts/taskgov.py doctor --repo . --read-only --json
          if ($LASTEXITCODE -ne 0) {
            throw 'Local package doctor command failed'
          }
          $doctor = $doctorJson | ConvertFrom-Json
          if (-not $doctor.ok -or $doctor.data.components.package.status -ne 'clean') {
            throw "Checked-in package is not clean: $($doctor.data.components.package.status)"
          }

          $removedCommands = @(
            ,@('self', 'status')
            ,@('db', 'status')
            ,@('web', 'export')
          )
          foreach ($parts in $removedCommands) {
            $removedJson = python task-governance-tool/scripts/taskgov.py @parts --read-only --json
            if ($LASTEXITCODE -ne 2) {
              throw "Removed public command did not fail with exit 2: $($parts -join ' ')"
            }
            $removed = $removedJson | ConvertFrom-Json
            if ($removed.ok -or $removed.errors[0].code -ne 'invalid_command') {
              throw "Removed public command did not return invalid_command: $($parts -join ' ')"
            }
          }

          $removedDbJson = python task-governance-tool/scripts/taskgov.py doctor --db ignored --json
          if ($LASTEXITCODE -ne 2) {
            throw 'Removed public --db option did not fail with exit 2'
          }
          $removedDb = $removedDbJson | ConvertFrom-Json
          if ($removedDb.ok -or $removedDb.errors[0].code -ne 'invalid_option') {
            throw 'Removed public --db option did not return invalid_option'
          }
          # Consume the deliberately validated native failure before the Actions epilogue.
          $LASTEXITCODE = 0

      - name: Skill package self-check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $skillRoot = 'task-governance-tool'
          $skillMd = Get-Content -Raw "$skillRoot/SKILL.md"
          $frontmatter = [regex]::Match($skillMd, '(?s)\A---\r?\n(.*?)\r?\n---')
          if (-not $frontmatter.Success) {
            throw 'SKILL.md is missing YAML frontmatter'
          }

          $keys = @()
          $name = $null
          $description = $null
          foreach ($line in ($frontmatter.Groups[1].Value -split "\r?\n")) {
            if ($line -match '^([^:]+):\s*(.*)$') {
              $keys += $Matches[1]
              if ($Matches[1] -eq 'name') {
                $name = $Matches[2]
              }
              if ($Matches[1] -eq 'description') {
                $description = $Matches[2]
              }
            }
          }

          if (($keys -join ',') -ne 'name,description') {
            throw "Unexpected frontmatter keys: $($keys -join ',')"
          }
          if ($name -ne 'task-governance-tool') {
            throw "Skill name mismatch: $name"
          }
          if (-not $description -or $description -notmatch 'task') {
            throw 'Skill description is missing task trigger context'
          }
          if (($skillMd -split "\r?\n").Count -gt 500) {
            throw 'SKILL.md exceeds the 500-line progressive-disclosure bound'
          }

          $requiredFiles = @(
            "$skillRoot/release-manifest.json",
            "$skillRoot/LICENSE",
            "$skillRoot/SKILL.md",
            "$skillRoot/agents/openai.yaml",
            "$skillRoot/scripts/taskgov.py",
            "$skillRoot/scripts/task_governance_tool/__init__.py",
            "$skillRoot/scripts/task_governance_tool/artifact_lock.py",
            "$skillRoot/scripts/task_governance_tool/backup.py",
            "$skillRoot/scripts/task_governance_tool/checkpoints.py",
            "$skillRoot/scripts/task_governance_tool/cli.py",
            "$skillRoot/scripts/task_governance_tool/compact.py",
            "$skillRoot/scripts/task_governance_tool/completion.py",
            "$skillRoot/scripts/task_governance_tool/completion_history_projection.py",
            "$skillRoot/scripts/task_governance_tool/completion_workflow.py",
            "$skillRoot/scripts/task_governance_tool/contracts.py",
            "$skillRoot/scripts/task_governance_tool/doctor.py",
            "$skillRoot/scripts/task_governance_tool/effort.py",
            "$skillRoot/scripts/task_governance_tool/git_snapshot.py",
            "$skillRoot/scripts/task_governance_tool/handoffs.py",
            "$skillRoot/scripts/task_governance_tool/maintenance.py",
            "$skillRoot/scripts/task_governance_tool/ordering.py",
            "$skillRoot/scripts/task_governance_tool/project_scope.py",
            "$skillRoot/scripts/task_governance_tool/relocation.py",
            "$skillRoot/scripts/task_governance_tool/review_packet.py",
            "$skillRoot/scripts/task_governance_tool/reviews.py",
            "$skillRoot/scripts/task_governance_tool/selection.py",
            "$skillRoot/scripts/task_governance_tool/self_status.py",
            "$skillRoot/scripts/task_governance_tool/setup.py",
            "$skillRoot/scripts/task_governance_tool/state_paths.py",
            "$skillRoot/scripts/task_governance_tool/state_resolver.py",
            "$skillRoot/scripts/task_governance_tool/state_transition.py",
            "$skillRoot/scripts/task_governance_tool/storage.py",
            "$skillRoot/scripts/task_governance_tool/tasks.py",
            "$skillRoot/scripts/task_governance_tool/viewer.py",
            "$skillRoot/scripts/task_governance_tool/viewer_config.py",
            "$skillRoot/scripts/task_governance_tool/viewer_maintenance.py",
            "$skillRoot/assets/task-viewer.template.html",
            "$skillRoot/references/task_workflow.md",
            "$skillRoot/references/reconciliation.md",
            "$skillRoot/references/cli_contracts.md"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Missing required skill package file: $file"
            }
          }
          $officialLicenseSha256 = 'cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30'
          if (-not (Test-Path -LiteralPath 'LICENSE' -PathType Leaf)) {
            throw 'Missing repository LICENSE'
          }
          $rootLicenseSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath 'LICENSE').Hash.ToLowerInvariant()
          $packageLicenseSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath "$skillRoot/LICENSE").Hash.ToLowerInvariant()
          if (
            $rootLicenseSha256 -ne $officialLicenseSha256 -or
            $packageLicenseSha256 -ne $officialLicenseSha256
          ) {
            throw 'Root and package LICENSE must match the official Apache-2.0 bytes'
          }
          if (
            (Test-Path -LiteralPath 'NOTICE') -or
            (Test-Path -LiteralPath "$skillRoot/NOTICE")
          ) {
            throw 'NOTICE requires a concrete reviewed attribution duty'
          }
          if (Test-Path "$skillRoot/config/viewer.json") {
            throw 'Optional Viewer config must not be shipped'
          }

          $runtimeInit = Get-Content -Raw "$skillRoot/scripts/task_governance_tool/__init__.py"
          $storage = Get-Content -Raw "$skillRoot/scripts/task_governance_tool/storage.py"
          $viewer = Get-Content -Raw "$skillRoot/scripts/task_governance_tool/viewer.py"
          $workflow = Get-Content -Raw "$skillRoot/references/task_workflow.md"
          $contracts = Get-Content -Raw "$skillRoot/references/cli_contracts.md"
          $readme = Get-Content -Raw 'README.md'
          $release = Get-Content -Raw 'docs/release-install.md'
          if ($runtimeInit -notmatch '__version__\s*=\s*"0\.10\.0"') {
            throw 'Runtime package version is not 0.10.0'
          }
          if ($storage -notmatch 'SCHEMA_VERSION\s*=\s*16') {
            throw 'Runtime schema version is not 16'
          }
          if ($viewer -notmatch 'SNAPSHOT_VERSION\s*=\s*4') {
            throw 'Viewer snapshot version is not 4'
          }
          $publicTokens = @(
            'git_snapshot',
            'handoff record',
            'setup',
            'doctor',
            'task checkpoint',
            'review prepare'
          )
          foreach ($document in @($skillMd, $workflow, $contracts, $readme, $release)) {
            foreach ($token in $publicTokens) {
              if ($document -notmatch [regex]::Escape($token)) {
                throw "Public guidance is missing $token"
              }
            }
          }
          foreach ($document in @($workflow, $contracts)) {
            foreach ($token in @('reopen', 'Task Contract', 'Effort Advisory')) {
              if ($document -notmatch [regex]::Escape($token)) {
                throw "Detailed guidance is missing $token"
              }
            }
          }
          if ($skillMd -notmatch 'effort_advisory_enabled' -or
              $skillMd -notmatch 'Task Contract' -or
              $skillMd -notmatch 'reopen') {
            throw 'Skill guidance is missing deterministic effort, Contract, or reopen routing'
          }
          if ($release -notmatch 'schema v16' -or
              $release -notmatch '0\.10\.0' -or
              $release -notmatch '\| Viewer snapshot \| v4,' -or
              $release -notmatch 'v5 through v16') {
            throw 'Release guidance is inconsistent with version 0.10.0/schema v16/Viewer v4 source v5-v16'
          }
          foreach ($document in @($skillMd, $workflow, $contracts, $readme, $release)) {
            foreach ($token in @(
              'relocation_preview',
              '--confirm-relocation',
              'explicit',
              'approval'
            )) {
              if ($document -notmatch [regex]::Escape($token)) {
                throw "Relocation guidance is missing $token"
              }
            }
          }
          foreach ($document in @($skillMd, $readme, $release)) {
            if ($document -notmatch '\.agents/skills/task-governance-tool') {
              throw 'Active install guidance is missing the project-scoped Skill path'
            }
          }
          if ($skillMd -match '\$CODEX_HOME/skills' -or $readme -match '\$CODEX_HOME/skills') {
            throw 'Active guidance must not advertise CODEX_HOME stateful use'
          }

      - name: Guard generated artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object {
            $_ -match '(^references/)' -or
            $_ -match '(^task-governance-tool/state/)' -or
            $_ -match '(^\.agents/skills/[^/]+/state/)' -or
            $_ -match '(^|/)task-viewer\.html$' -or
            $_ -match '(\.sqlite3?$|\.sqlite3?-(shm|wal|journal)$)' -or
            $_ -match '(\.db$|\.db-(shm|wal|journal)$)' -or
            $_ -match '(__pycache__/|\.pyc$|\.log$|\.tmp$)'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked artifact: $_" }
            throw 'Forbidden generated artifacts are tracked'
          }
